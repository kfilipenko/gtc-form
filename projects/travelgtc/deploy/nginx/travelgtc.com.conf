# TravelGTC public static site.
# Install to /etc/nginx/sites-available/travelgtc.com.conf and enable from sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name www.travelgtc.com;

    root /var/www/travelgtc.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    return 301 http://travelgtc.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name travelgtc.com;

    root /var/www/travelgtc.com;
    index index.html;

    access_log /var/log/nginx/travelgtc.access.log;
    error_log /var/log/nginx/travelgtc.error.log;

    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        default_type text/html;
        try_files /index.html =404;
    }

    location = /index.html {
        default_type text/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ^~ /assets/images/inbox/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
