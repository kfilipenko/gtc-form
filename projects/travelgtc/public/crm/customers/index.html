<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelGTC CRM - клиенты</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Manrope:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand brand-logo" href="/" aria-label="TravelGTC"><img src="/assets/images/processed/travelgtc-logo-header.webp" alt="TravelGTC"></a>
        <nav class="nav-links nav-links-membership" aria-label="CRM меню">
          <a href="/">Сайт</a>
          <a href="/crm/">CRM</a>
          <a class="active" href="/crm/customers/">Клиенты</a>
        </nav>
        <div class="nav-actions"><div class="account-actions" data-auth-state><a class="account-link" href="/auth/?mode=login" data-auth-anonymous>Войти</a><div class="account-user" data-auth-user hidden><span data-auth-user-name>Аккаунт</span><button class="account-logout" type="button" data-auth-logout>Выйти</button></div></div><button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" data-menu-toggle><span></span><span></span><span></span></button></div>
      </div>
    </header>

    <main class="crm-page" data-crm-customers-page>
      <section class="crm-shell">
        <div class="section-head">
          <p class="eyebrow dark">TravelGTC CRM</p>
          <h1>Клиенты</h1>
          <p>Полные данные профиля, все заявки, задачи и история работы по каждому человеку.</p>
        </div>

        <div class="crm-status" data-crm-customers-status>Загружаем клиентов...</div>

        <div class="crm-layout" hidden data-crm-customers-workspace>
          <section class="crm-list" aria-label="Список клиентов">
            <div class="crm-list-head crm-list-head-stack">
              <strong>Клиенты</strong>
              <label class="sr-only" for="crm-customer-search">Поиск клиента</label>
              <input id="crm-customer-search" type="search" autocomplete="off" placeholder="Имя, email или телефон" data-crm-customer-search>
              <button class="button ghost small" type="button" data-crm-customers-refresh>Обновить</button>
            </div>
            <div class="crm-leads" data-crm-customers></div>
          </section>

          <section class="crm-detail" aria-label="Карточка клиента">
            <div data-crm-customer-empty>
              <h2>Выберите клиента</h2>
              <p>Откройте запись слева, чтобы увидеть его данные регистрации, заявки, диалог с Мирой и внутреннюю историю.</p>
            </div>
            <div hidden data-crm-customer-detail></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/js/site.js"></script>
</body>
</html>
